<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ポイントカード</title>
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root {
    --bg: #f4f2ee;
    --card: #ffffff;
    --ink: #1f1d1a;
    --sub: #77716a;
    --accent: #b8925a;
    --line: #e6e1d9;
    --err: #b3412e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Hiragino Sans", "Noto Sans JP", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  main { max-width: 420px; margin: 0 auto; padding: 20px 16px 40px; }
  .card {
    background: var(--card);
    border-radius: 18px;
    padding: 24px 20px;
    box-shadow: 0 1px 2px rgba(0,0,0,.04), 0 8px 24px rgba(0,0,0,.05);
    text-align: center;
  }
  .label { font-size: 12px; color: var(--sub); letter-spacing: .08em; }
  .name { font-size: 15px; margin: 4px 0 18px; }
  #qr { display: inline-block; padding: 12px; background: #fff; border: 1px solid var(--line); border-radius: 12px; }
  #qr img, #qr canvas { display: block; }
  .no { font-family: ui-monospace, Menlo, monospace; font-size: 20px; letter-spacing: .2em; margin-top: 10px; }
  .hint { font-size: 12px; color: var(--sub); margin-top: 6px; }
  .balance { margin-top: 22px; padding-top: 18px; border-top: 1px solid var(--line); }
  .pt { font-size: 40px; font-weight: 700; line-height: 1.1; }
  .pt small { font-size: 16px; font-weight: 500; margin-left: 4px; color: var(--sub); }
  h2 { font-size: 13px; color: var(--sub); font-weight: 500; margin: 26px 4px 8px; }
  ul { list-style: none; margin: 0; padding: 0; background: var(--card); border-radius: 14px; overflow: hidden; }
  li { display: flex; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid var(--line); font-size: 14px; }
  li:last-child { border-bottom: none; }
  li .plus { color: var(--accent); font-weight: 600; }
  .empty { color: var(--sub); justify-content: center; }
  button {
    display: block; width: 100%; margin-top: 18px; padding: 13px;
    border: 1px solid var(--line); border-radius: 12px; background: var(--card);
    font-size: 15px; color: var(--ink);
  }
  #status { text-align: center; color: var(--sub); padding: 60px 0; font-size: 14px; }
  #status.err { color: var(--err); }
  .hidden { display: none; }
</style>
</head>
<body>
<main>
  <div id="status">読み込み中…</div>

  <div id="app" class="hidden">
    <div class="card">
      <div class="label">MEMBER</div>
      <div class="name" id="name"></div>
      <div id="qr"></div>
      <div class="no" id="memberNo"></div>
      <div class="hint">会計のときにスタッフに見せてください</div>
      <div class="balance">
        <div class="label">ポイント残高</div>
        <div class="pt"><span id="balance">0</span><small>pt</small></div>
      </div>
    </div>

    <h2>最近の履歴</h2>
    <ul id="history"></ul>

    <button id="reload">最新の状態にする</button>
  </div>
</main>

<script>
  // ===== 設定（ステップ2・3のあとで書き換えます） =====
  const LIFF_ID = '2012338431-CP4exxJ8';
  const GAS_URL = 'https://script.google.com/macros/s/AKfycbwF6u3eB8Oc6B4kUPo0Vkt0CS7SF783wJME-csFJ4QfuXbtqbYwH0b4E7o5B1SSiwGo/exec';

  const $ = id => document.getElementById(id);

  function showError(msg) {
    $('app').classList.add('hidden');
    $('status').classList.remove('hidden');
    $('status').classList.add('err');
    $('status').textContent = msg;
  }

  async function callGas(body) {
    const res = await fetch(GAS_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(body)
    });
    return res.json();
  }

  async function load() {
    $('status').classList.remove('hidden', 'err');
    $('status').textContent = '読み込み中…';

    const idToken = liff.getIDToken();
    if (!idToken) { liff.login(); return; }

    const data = await callGas({ action: 'me', idToken });
    if (!data.ok) { showError(data.error || 'エラーが起きました'); return; }

    $('name').textContent = data.name ? data.name + ' さん' : '';
    $('memberNo').textContent = data.memberNo;
    $('balance').textContent = Number(data.balance).toLocaleString();

    $('qr').innerHTML = '';
    new QRCode($('qr'), { text: data.memberNo, width: 200, height: 200, correctLevel: QRCode.CorrectLevel.M });

    const ul = $('history');
    ul.innerHTML = '';
    if (!data.history || data.history.length === 0) {
      ul.innerHTML = '<li class="empty">まだ履歴はありません</li>';
    } else {
      data.history.forEach(h => {
        const li = document.createElement('li');
        li.innerHTML = '<span></span><span class="plus"></span>';
        li.children[0].textContent = h.day + '　' + h.store;
        li.children[1].textContent = '+' + Number(h.points).toLocaleString() + 'pt';
        ul.appendChild(li);
      });
    }

    $('status').classList.add('hidden');
    $('app').classList.remove('hidden');
  }

  $('reload').addEventListener('click', () => load().catch(e => showError('通信に失敗しました：' + e.message)));

  liff.init({ liffId: LIFF_ID })
    .then(() => {
      if (!liff.isLoggedIn()) { liff.login(); return; }
      return load();
    })
    .catch(e => showError('起動に失敗しました：' + e.message));
</script>
</body>
</html>
